name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Fleet structure, hook, permissions, consolidation self-test
        run: python scripts/validate_fleet.py
      - name: Hygiene (no em-dash, no real secrets, no client contamination)
        run: python scripts/hygiene_check.py
      - name: Consolidation escalation rules self-test
        run: python scripts/consolidate_findings.py --self-test
      - name: ASVS matrix generates at L1 and L2
        run: |
          python scripts/generate_asvs_matrix.py --level L2 --reference-dir reference --consolidated /nonexistent.json --out /tmp/asvs-L2.csv
          python scripts/generate_asvs_matrix.py --level L1 --reference-dir reference --consolidated /nonexistent.json --out /tmp/asvs-L1.csv
      - name: Installer and fixture scripts are syntactically valid
        run: |
          bash -n install.sh
          bash -n scripts/make_fixture_repo.sh
